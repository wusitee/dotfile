# Cap the OneDrive client so its long-running monitor-mode memory growth
# (observed at 10+ GiB RAM plus swap for a 57-item drive) cannot push the
# rest of the session into swap. The kernel kills it at the cap and the
# packaged unit's Restart=on-failure starts a fresh client; each exit logs
# "memory peak" to the user journal.
[Service]
MemoryMax=1G
MemorySwapMax=0
