# dorm-dev runs as a server: closing the Moonlight stream locks and blanks the
# panel (remote-dev/sunshine-apps.json). This only covers a dropped connection
# that leaves the session unlocked. Never idle-suspend.
general {
    lock_cmd = pgrep hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
