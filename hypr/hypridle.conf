general {
    lock_cmd = pgrep hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 600
    on-timeout = if ! playerctl --all-players status 2>/dev/null | rg Playing; then loginctl lock-session; fi
}

listener {
    timeout = 900
    on-timeout = if ! playerctl --all-players status 2>/dev/null | rg Playing; then hyprctl dispatch 'hl.dsp.dpms({action = "off"})'; fi
    on-resume =  hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = if ! playerctl --all-players status 2>/dev/null | rg Playing; then systemctl suspend; fi
}
