[terminal]
vt = 1

# Boot into the desktop so Sunshine has a session to stream. Hyprland locks
# this session at start; later tuigreet logins are not locked again.
[initial_session]
command = "env DORM_DEV_AUTOLOGIN=1 /usr/bin/start-hyprland"
user = "wste"

[default_session]
command = "tuigreet --time --remember --asterisks --cmd /usr/bin/start-hyprland"
user = "greeter"
