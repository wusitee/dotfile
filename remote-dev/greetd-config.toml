[terminal]
vt = 1

# Boot into the desktop so Sunshine has a session to stream; Hyprland locks it
# immediately on this host.
[initial_session]
command = "/usr/bin/start-hyprland"
user = "wste"

[default_session]
command = "tuigreet --time --remember --asterisks --cmd /usr/bin/start-hyprland"
user = "greeter"
